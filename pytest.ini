[pytest]
testpaths = tests
python_files = test_*.py

# Qt has to be told there is no display before anything imports it; conftest.py
# does that, but only if pytest imports conftest before collecting. rootdir
# being the repo root is also what puts `modules`/`app`/`pipeline` on the path.
addopts = -q --strict-markers --import-mode=importlib

markers =
    psd: needs the PhotoshopAPI wheel, which has no build for some platforms
