[pytest]
testpaths = tests
python_files = test_*.py

# Qt has to be told there is no display before anything imports it; conftest.py
# does that, but only if pytest imports conftest before collecting. rootdir
# being the repo root is also what puts `modules`/`app`/`pipeline` on the path.
# `-m "not photopea"` keeps the browser-driven check out of a plain run: it
# needs Chromium and reaches photopea.com, and a gate that depends on either
# is worse than no gate. Run it deliberately with `pytest -m photopea`.
addopts = -q --strict-markers --import-mode=importlib -m "not photopea"

markers =
    psd: needs the PhotoshopAPI wheel, which has no build for some platforms
    photopea: drives Photopea in a real browser; needs network and playwright
