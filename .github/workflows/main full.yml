# Same app as build-windows.yml, plus the PyTorch stack, so the bundle can run
# the PaddleOCR-VL text recognition engine without a Python install.
#
# Kept as a separate workflow rather than folded into the normal build because
# torch multiplies the download from a few hundred megabytes to several
# gigabytes, and most people never touch that engine. Ship the lean build as
# the default; offer this one to whoever wants PaddleOCR-VL.
#
# CPU wheels only. A CUDA build would be larger again and would still be wrong
# for anyone without a matching driver, so GPU users are better served running
# from source with the CUDA index.
name: Build Windows App (with PaddleOCR-VL)

on:
  workflow_dispatch:

jobs:
  build-windows-full:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install "transformers>=5"
          pip install pyinstaller

      - name: Build app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name ToonStudio `
            --icon resources/icons/icon.ico `
            --add-data "resources;resources" `
            --collect-all torch `
            --collect-all torchvision `
            --collect-all transformers `
            --collect-all tokenizers `
            --collect-all safetensors `
            --hidden-import transformers.models.paddleocr_vl `
            --collect-all openvino `
            comic.py

      - name: Smoke test bundle
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/ToonStudio/ToonStudio.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Error "App exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "Smoke test passed"

      # The point of this build is that the engine is actually reachable, which
      # the app's own availability check decides. Assert it here rather than
      # discovering after release that a collect-all silently missed something.
      - name: Verify the PyTorch stack is bundled
        shell: pwsh
        run: |
          $missing = @()
          foreach ($pkg in @('torch', 'torchvision', 'transformers')) {
            if (-not (Get-ChildItem -Path dist/ToonStudio -Recurse -Directory -Filter $pkg -ErrorAction SilentlyContinue)) {
              $missing += $pkg
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Not bundled: $($missing -join ', ') - PaddleOCR-VL would be unavailable in this build"
            exit 1
          }
          Write-Output "torch, torchvision and transformers are all present"

      # Text segmentation falls back to ONNX Runtime (37-40 s per call instead
      # of ~0.5 s) when OpenVINO is unusable, silently. PyInstaller can ship the
      # package without the plugins it loads by path, so the frozen exe proves
      # the ONNX frontend and CPU plugin work, not just that the import does.
      - name: Verify OpenVINO is bundled
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -File -Filter 'ToonStudio.exe' |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "no ToonStudio.exe in dist"; exit 1 }
          $errFile = Join-Path $env:RUNNER_TEMP 'openvino-self-test.err'
          $proc = Start-Process -FilePath $exe.FullName `
                                -ArgumentList '--openvino-self-test' `
                                -Wait -PassThru -NoNewWindow `
                                -RedirectStandardError $errFile
          $detail = if (Test-Path $errFile) { (Get-Content $errFile -Raw) } else { '' }
          if ($proc.ExitCode -ne 0) {
            Write-Error "the OpenVINO self-test failed in the bundle (exit $($proc.ExitCode)): $detail"
            exit 1
          }
          Write-Output "OpenVINO self-test passed in the frozen bundle"

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist/ToonStudio -DestinationPath dist/ToonStudio-Windows-x86_64-full.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: Comic-Translate-Windows-Full
          path: dist/ToonStudio-Windows-x86_64-full.zip
          if-no-files-found: error
          retention-days: 30
