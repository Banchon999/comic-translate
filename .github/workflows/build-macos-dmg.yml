name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build app with PyInstaller
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: pyinstaller ct-mac.spec

      # Same reason as the other builds: a missing skia is silent, because
      # core/skia_text.py guards the import and the app falls back to Qt.
      # Checked before the DMG is packed, against the .app PyInstaller made.
      - name: Verify the Skia text engine is bundled
        run: |
          if ! find dist -name 'skia*.so' -print -quit | grep -q .; then
            echo "skia-python is not in the bundle - the Skia text engine would be unavailable" >&2
            exit 1
          fi
          echo "Skia bundled: $(find dist -name 'skia*.so' -print -quit)"

      - name: Build DMG
        run: |
          chmod +x builddmg.sh
          ./builddmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Comic-Translate-macOS
          path: "dist/Comic Translate.dmg"
          if-no-files-found: error
          retention-days: 30
