name: Tests

# The build workflows are workflow_dispatch only — they take a long time and
# produce artefacts nobody wants on every commit. This one is the opposite: it
# runs in a couple of minutes and only matters if it runs unasked, so it is the
# one workflow wired to push and pull_request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the setup instructions in CLAUDE.md use; 3.14 is what
        # every build workflow ships. Running both is what catches the two
        # drifting apart.
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system libraries
        # Qt needs these even with no display attached; the offscreen platform
        # still loads the xcb plugin's dependency chain.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
