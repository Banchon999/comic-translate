name: Release

# Publishes a commit as a GitHub Release: the test suite, then the Windows,
# Linux and macOS builds (the very workflows behind the manual "Run workflow"
# buttons), then one release carrying all three downloads and the notes
# written for it in .github/release-notes/vX.Y.Z.md.
#
# Two ways to start it:
#   - push a tag vX.Y.Z — the tag must match app/version.py;
#   - "Run workflow" on main — the tag is taken from app/version.py and
#     created with the release, on the commit that was built. A version
#     whose tag already exists is refused rather than published twice.
# Either way the version comes from app/version.py, so About, the update
# checker and the release page agree, and the notes file must exist, so a
# release never goes out with an empty description.
#
# The PyTorch "full" Windows build is not part of it: it is several gigabytes,
# and GitHub caps a release asset at 2 GB.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: The version, its tag and its release notes agree
        id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/version.py').read()).group(1))")
          tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match app/version.py (${version})"
              exit 1
            fi
          else
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::run the release from main, not ${GITHUB_REF_NAME}"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::error::${tag} already exists - bump app/version.py for a new release"
              exit 1
            fi
          fi
          notes=".github/release-notes/${tag}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::missing release notes: $notes"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  tests:
    needs: check
    uses: ./.github/workflows/test.yml

  windows:
    needs: tests
    uses: ./.github/workflows/build-windows.yml

  linux:
    needs: tests
    uses: ./.github/workflows/build-linux.yml

  macos:
    needs: tests
    uses: ./.github/workflows/build-macos-dmg.yml

  publish:
    needs: [check, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the builds
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag does not exist yet: the release creates it
          # on the commit that was tested and built.
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Toon Studio ${{ needs.check.outputs.tag }}
          body_path: .github/release-notes/${{ needs.check.outputs.tag }}.md
          files: |
            dist/ToonStudio-Windows-x86_64.zip
            dist/ToonStudio-Linux-x86_64.tar.gz
            dist/ToonStudio-macOS-arm64.dmg
          fail_on_unmatched_files: true
